<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 668" role="img" aria-labelledby="title desc">
<title id="title">Funnelcast sales funnel and forecast front page</title>
<desc id="desc">Light Funnelcast landing page with a sales funnel preview and the headline From cold list to closed deal, forecast included.</desc>
<defs>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4e46e8"/><stop offset="1" stop-color="#8639ef"/></linearGradient>
  <linearGradient id="stage1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4338ca"/><stop offset="1" stop-color="#4e46d8"/></linearGradient>
  <linearGradient id="stage2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5245e6"/><stop offset="1" stop-color="#6044e8"/></linearGradient>
  <linearGradient id="stage3" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6845e8"/><stop offset="1" stop-color="#7b39e9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38406f" flood-opacity=".09"/></filter>
</defs>
<rect width="1068" height="668" fill="#f6f6fb"/>
<rect y="0" width="1068" height="52" fill="#fafaff"/>
<path d="M0 52.5h1068" stroke="#e3e5ef"/>
<g transform="translate(126 13)"><rect width="25" height="25" rx="7" fill="url(#purple)"/><path d="M6 6h14l-5 6v7l-4 2v-9z" fill="#fff"/><circle cx="20" cy="19" r="2.5" fill="#ff7a18"/></g>
<text x="160" y="31" fill="#151936" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="-.5">Funnelcast</text>
<g fill="#606887" font-family="Arial,sans-serif" font-size="11" font-weight="600"><text x="603" y="30">Stages</text><text x="665" y="30">Leads</text><text x="720" y="30">Forecast</text><text x="791" y="30">How it works</text></g>
<rect x="868" y="11" width="91" height="31" rx="16" fill="url(#purple)"/><text x="913.5" y="31" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Book a call</text>
<g transform="translate(126 116)">
  <rect width="163" height="26" rx="13" fill="#eceaff"/><circle cx="12" cy="13" r="2.6" fill="#ff7a18"/><text x="22" y="17" fill="#5048e9" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.15">USA OUTBOUND PIPELINE</text>
  <text x="0" y="198" fill="#151936" font-family="Arial,sans-serif" font-size="45" font-weight="800" letter-spacing="-2.3">From cold list to</text>
  <text x="0" y="244" fill="url(#purple)" font-family="Arial,sans-serif" font-size="45" font-weight="800" letter-spacing="-2.3">closed deal,</text>
  <text x="0" y="290" fill="#151936" font-family="Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="-2.1">forecast included.</text>
  <g fill="#626b8b" font-family="Arial,sans-serif" font-size="14"><text x="0" y="334">146 US decision makers go in. A forecast of deals, revenue</text><text x="0" y="357">and the gap to your annual target comes out. Change any rate</text><text x="0" y="380">and the funnel recalculates instantly.</text></g>
  <rect x="0" y="408" width="136" height="34" rx="9" fill="url(#purple)"/><text x="68" y="430" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Adjust the forecast</text>
  <rect x="143" y="408" width="94" height="34" rx="9" fill="#f6f6fb" stroke="#dfe3ef"/><text x="190" y="430" fill="#151936" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">See the list</text>
</g>
<g filter="url(#shadow)">
  <rect x="558" y="101" width="382" height="416" rx="20" fill="#fff" stroke="#e0e4f0"/>
  <text x="582" y="131" fill="#666e8b" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">EXPECTED VOLUME AT EACH STAGE</text>
  <g font-family="Arial,sans-serif" font-weight="700" fill="#fff">
    <rect x="582" y="151" width="334" height="40" rx="10" fill="#4338ca"/><text x="594" y="176" font-size="11">Prospects</text><text x="900" y="176" text-anchor="end" font-size="17">146</text>
    <rect x="601" y="197" width="306" height="40" rx="10" fill="#5144e4"/><text x="613" y="222" font-size="11">Reachable</text><text x="891" y="222" text-anchor="end" font-size="17">142</text>
    <rect x="620" y="243" width="270" height="40" rx="10" fill="#6544e8"/><text x="632" y="268" font-size="11">Replied</text><text x="874" y="268" text-anchor="end" font-size="17">≈ 14</text>
    <rect x="639" y="289" width="234" height="40" rx="10" fill="#783ce9"/><text x="651" y="314" font-size="11">Meetings</text><text x="857" y="314" text-anchor="end" font-size="17">≈ 5.7</text>
    <rect x="658" y="335" width="198" height="40" rx="10" fill="#a03ed3"/><text x="670" y="360" font-size="11">Proposals</text><text x="840" y="360" text-anchor="end" font-size="17">≈ 3.4</text>
    <rect x="677" y="381" width="162" height="40" rx="10" fill="#ff7417"/><text x="689" y="406" font-size="11">Closed won</text><text x="823" y="406" text-anchor="end" font-size="17">≈ 1</text>
  </g>
</g>
</svg>